line-length = 100
target-version = "py314"
src = ["backend", "."]
exclude = [
    "scripts",
    "backend/scripts",
    "backend/data",
    "backend/.venv",
    "diagnose_settings.py",
    "fix_texas_claims.py",
    "generate_html_report.py",
    "run_live_e2e_demo.py",
    "seed_user_claim.py",
    "seed_rich_data.py",
    "run_e2e.py",
    "live_e2e_verification.py",
    "frontend",
    "e2e/frontend",
    "node_modules",
]

[lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501", "W293", "E741", "E402", "UP037"]

[lint.isort]
known-first-party = ["app"]
