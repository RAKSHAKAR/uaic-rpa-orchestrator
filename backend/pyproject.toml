[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "uaic-claim-orchestrator"
version = "1.0.0"
description = "Modern distributed claim ingestion, county court RPA orchestrator, and fuzzy matching engine"
authors = [
    { name = "Engineering Team", email = "engineering@example.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.2.1,<3.0.0",
    "celery[redis]>=5.3.6,<6.0.0",
    "redis>=5.0.2,<6.0.0",
    "sqlalchemy[asyncio]>=2.0.35,<3.0.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.1",
    "pandas>=2.2.3,<3.0.0",
    "openpyxl>=3.1.5,<4.0.0",
    "rapidfuzz>=3.6.1,<4.0.0",
    "playwright>=1.48.0,<2.0.0",
    "httpx>=0.27.2,<1.0.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
    "aiofiles>=24.1.0",
    "flower>=2.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3,<9.0.0",
    "pytest-asyncio>=0.23.5",
    "pytest-mock>=3.12.0",
    "ruff>=0.6.9,<1.0.0",
    "flower>=2.0.1",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501", "W293", "E741", "E402", "UP037"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = [
    "tests",
]
pythonpath = [
    ".",
    "app"
]
filterwarnings = [
    "ignore::pytest.PytestUnhandledThreadExceptionWarning",
    "ignore::ResourceWarning",
    "ignore:.*closed pipe.*:pytest.PytestUnraisableExceptionWarning",
]
markers = [
    "requires_redis: test requires a live Redis instance on localhost:6379",
    "requires_maildev: test requires a live MailDev SMTP server on localhost:1025",
    "e2e: end-to-end browser automation tests requiring real browser",
    "unattended: unattended headless browser automation tests",
]

[tool.setuptools.packages.find]
include = ["app*"]
