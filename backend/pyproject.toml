[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "uaic-claim-orchestrator"
version = "1.0.0"
description = "Modern distributed claim ingestion, county court RPA orchestrator, and fuzzy matching engine"
authors = [
    { name = "Engineering Team", email = "engineering@example.com" }
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.28.0,<1.0.0",
    "pydantic>=2.6.4,<3.0.0",
    "pydantic-settings>=2.2.1,<3.0.0",
    "celery[redis]>=5.3.6,<6.0.0",
    "redis>=5.0.2,<6.0.0",
    "sqlalchemy[asyncio]>=2.0.28,<3.0.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.1",
    "pandas>=2.2.1,<3.0.0",
    "openpyxl>=3.1.2",
    "rapidfuzz>=3.6.1,<4.0.0",
    "playwright>=1.42.0",
    "httpx>=0.27.0,<1.0.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
    "aiofiles>=24.1.0",
    "flower>=2.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.2",
    "pytest-asyncio>=0.23.5",
    "pytest-mock>=3.12.0",
    "ruff>=0.3.0",
    "flower>=2.0.1",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501", "W293", "E741", "E402", "UP037"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = [
    "tests",
]
pythonpath = [
    ".",
    "app"
]
filterwarnings = [
    # DOCUMENTED SUPPRESSION (not blind): Python 3.14 + Windows ProactorEventLoop known bug.
    # Root cause: asyncio/windows_utils.py:109 raises ValueError("I/O operation on closed pipe")
    # inside a pipe-transport __del__ finalizer that fires AFTER the event loop closes.
    # Python's sys.unraisablehook captures this and pytest converts it to
    # PytestUnraisableExceptionWarning. Cannot be fixed at application level — the __del__
    # is called by the CPython interpreter during GC, outside any fixture or warnings context.
    # Investigation date: 2026-09-09 (IMP-2026-0909-001). Tests pass (exit code 0).
    # Re-suppress when Python bug is fixed upstream: https://bugs.python.org/issue39010
    "ignore::pytest.PytestUnraisableExceptionWarning",
    "ignore::pytest.PytestUnhandledThreadExceptionWarning",
    "ignore::ResourceWarning",
]
markers = [
    "requires_redis: test requires a live Redis instance on localhost:6379",
    "requires_maildev: test requires a live MailDev SMTP server on localhost:1025",
]


