# Root docker-compose.yml (Unified Local/VPS Orchestrator)

services:
  db:
    image: postgres:15-alpine
    container_name: uaic_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-uaic_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: uaic_redis
    ports:
      - "6379:6379"
    restart: always

  maildev:
    image: maildev/maildev:2.1.0
    container_name: uaic_maildev
    ports:
      - "1080:1080"
      - "1025:1025"
    restart: always

  # Application containers are defined below but are NOT started by the 
  # setup_local.ps1 script during local dev (PS1 starts them natively).
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uaic_fastapi
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    volumes:
      - ./backend/screenshots:/app/screenshots
      - ./backend/logs:/app/logs
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-uaic_db}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-supersecretdevelopmentkeyfororchestrator}
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    restart: always

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uaic_celery_worker
    command: celery -A app.core.celery_app worker --concurrency=10 --loglevel=info
    volumes:
      - ./backend/screenshots:/app/screenshots
      - ./backend/logs:/app/logs
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-uaic_db}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-supersecretdevelopmentkeyfororchestrator}
    depends_on:
      - db
      - redis
    restart: always

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uaic_celery_beat
    command: celery -A app.core.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-uaic_db}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-supersecretdevelopmentkeyfororchestrator}
    depends_on:
      - db
      - redis
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api/v1
    container_name: uaic_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api/v1
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    restart: always

volumes:
  postgres_data: