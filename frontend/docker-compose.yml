version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: uaic_postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: uaic_redis
    restart: always

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: uaic_fastapi
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4
    volumes:
      - ./backend/screenshots:/app/backend/screenshots
      - ./backend/logs:/app/backend/logs
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    restart: always

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: uaic_celery_worker
    command: celery -A worker.celery_app worker --concurrency=10 --loglevel=info
    volumes:
      - ./backend/screenshots:/app/backend/screenshots
      - ./backend/logs:/app/backend/logs
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      - db
      - redis
    restart: always

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: uaic_celery_beat
    command: celery -A worker.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      - db
      - redis
    restart: always

volumes:
  postgres_data: